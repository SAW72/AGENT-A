<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent-BV is Bot Verifier. Check the bot before you sign." />
    <title>Agent-BV — Bot Verifier</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var key = "agent-bv-theme";
        var q = new URLSearchParams(location.search).get("theme");
        var theme = q === "dark" || q === "light" ? q : "light";
        if (q !== "dark" && q !== "light") {
          try {
            theme = localStorage.getItem(key) || "light";
          } catch (e) {
            theme = "light";
          }
        }
        if (theme !== "dark" && theme !== "light") theme = "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="bar">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
        Dark
      </button>
    </header>
    <main class="split">
      <section class="stage" aria-label="Agent-BV mascot">
        <div class="mascot-wrap">
          <div class="oval" aria-hidden="true"></div>
          <img
            class="mascot"
            src="agent-bv-mascot-brightwhite.png"
            width="1152"
            height="1728"
            alt="Agent-BV mascot, a white hexagonal head in a black fedora"
          />
        </div>
      </section>
      <section class="panel" aria-label="Agent-BV">
        <div class="hex">
          <div class="hex-copy">
            <h1 class="wordmark">Agent-BV</h1>
            <p class="descriptor">Bot Verifier</p>
            <p class="value">Check the bot before you sign.</p>
            <a class="btn btn-primary" href="https://github.com/SAW72/bot-verifier">Start a check →</a>
          </div>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var key = "agent-bv-theme";
        var root = document.documentElement;
        var button = document.getElementById("theme-toggle");

        function apply(theme) {
          root.setAttribute("data-theme", theme);
          var dark = theme === "dark";
          button.textContent = dark ? "Light" : "Dark";
          button.setAttribute("aria-pressed", dark ? "true" : "false");
          try {
            localStorage.setItem(key, theme);
          } catch (e) {}
        }

        apply(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
        button.addEventListener("click", function () {
          apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        });
      })();
    </script>
  </body>
</html>
